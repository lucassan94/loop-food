# =============================================================================
# loop-food — Ambiente de DESENVOLVIMENTO
# =============================================================================
# Use esta stack no Portainer para o ambiente de dev.
# Portas diferentes (9090-9094) para não conflitar com produção (8090-8094).
# Banco de dados: delivery_dev (isolado da produção)
# =============================================================================

services:
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9090:3001"
    environment:
      - NODE_ENV=development
      - DB_HOST=${DEV_DB_HOST:-86.48.18.22}
      - DB_PORT=${DEV_DB_PORT:-5432}
      - DB_NAME=${DEV_DB_NAME:-delivery_dev}
      - DB_USER=${DEV_DB_USER:-default}
      - DB_PASS=${DEV_DB_PASS}
      - JWT_SECRET=${DEV_JWT_SECRET:-dev-secret-change-me}
      - RESTAURANT_ID=${DEV_RESTAURANT_ID:-1}
      - CORS_ORIGIN=${DEV_CORS_ORIGIN:-*}

      # Asaas sandbox para dev (todas via env var, consistente)
      - ASAAS_API_KEY=${DEV_ASAAS_API_KEY}
      - ASAAS_ENV=${DEV_ASAAS_ENV:-sandbox}
      - ASAAS_WEBHOOK_TOKEN=${DEV_ASAAS_WEBHOOK_TOKEN}
      - ASAAS_WEBHOOK_SECRET=${DEV_ASAAS_WEBHOOK_SECRET}

      # Upload
      - UPLOAD_DIR=${DEV_UPLOAD_DIR:-./uploads}
      - MAX_FILE_SIZE=${DEV_MAX_FILE_SIZE:-5242880}
    volumes:
      - backend_uploads_dev:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  cliente-dev:
    build:
      context: ./cliente
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9091:80"
    depends_on:
      - backend-dev

  restaurante-dev:
    build:
      context: ./restaurante
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9092:80"
    depends_on:
      - backend-dev

  entregador-dev:
    build:
      context: ./entregador
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9093:80"
    depends_on:
      - backend-dev

  router-dev:
    build:
      context: .
      dockerfile: router/Dockerfile
    restart: unless-stopped
    ports:
      - "9094:80"
    depends_on:
      - backend-dev

volumes:
  backend_uploads_dev:
