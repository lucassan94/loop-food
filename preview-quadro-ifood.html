<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Quadro de Expedição (iFood)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "iFood RC Textos", Helvetica, Arial, sans-serif; background: #fff; padding: 24px; }
  .ifood-board { display: flex; flex-direction: column; gap: 8px; }
  .ifood-lane {
    display: flex; flex-direction: column; padding: 8px; border-radius: 16px;
    background-color: #F5F5F5; gap: 4px; overflow: hidden;
  }
  .ifood-lane-header {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 0 8px; border: none; background: none; cursor: pointer; font-family: inherit;
  }
  .ifood-lane-title { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .ifood-lane-title h3 { margin: 0; font-size: 18px; line-height: 24px; color: #151515; font-weight: 500; }
  .ifood-lane-count {
    display: inline-block; border: 1px solid #666; background-color: #666; color: #fff;
    font-size: 12px; font-weight: 700; border-radius: 16px; line-height: 16px; padding: 0 8px;
  }
  .ifood-lane-header svg { color: #EB0033; flex-shrink: 0; }
  .ifood-lane-cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    grid-auto-rows: max-content; gap: 4px;
  }
  .ifood-lane-empty { text-align: center; color: #A3A3A3; font-size: 14px; font-weight: 500; line-height: 16px; padding: 18px 8px; width: 100%; }
  .ifood-card {
    min-width: 120px; max-width: 146px; width: 100%; display: flex; flex-direction: column;
    justify-content: space-between; box-sizing: border-box; padding: 8px 12px; background: #fff;
    cursor: pointer; border-radius: 16px; border: 1px solid #EBEBEB; position: relative; transition: border-color 0.15s;
  }
  .ifood-card:hover { border-color: #CCC; }
  .ifood-card.urgente { border-color: #EB0033; box-shadow: #EB0033 0 0 0 1px inset; }
  .ifood-card-num { display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 32px; line-height: 32px; color: #151515; }
  .ifood-card-nome {
    display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap;
    text-overflow: ellipsis; overflow: hidden; text-transform: capitalize; text-align: center;
    font-weight: 500; font-size: 14px; line-height: 16px; color: #666;
  }
  .ifood-card-chip { text-align: center; font-size: 11px; color: #999; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ifood-card-btn {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 4px; overflow: hidden;
    box-sizing: border-box; margin-top: 12px; width: 100%; border-radius: 9999px; font-family: inherit;
    font-weight: 500; font-size: 12px; line-height: 16px; padding: 2px 8px; white-space: nowrap;
    background-color: #EB0033; color: #fff; border: none; cursor: pointer; height: 24px;
  }
  .ifood-card-btn:hover { background-color: #FA5266; }
  .ifood-card-btn-bar { position: absolute; top: 0; right: 0; height: 100%; width: 0; background-color: rgba(255,255,255,0.64); pointer-events: none; animation: ifood-countdown 300s linear -47s; }
  .ifood-card-btn-label { position: relative; z-index: 1; }
  .ifood-card-btn-muted { background: transparent; border: 1px solid #EBEBEB; color: #666; cursor: default; }
  @keyframes ifood-countdown { from { width: 0; } to { width: 100%; } }
</style>
</head>
<body>

<div class="ifood-board">

  <!-- Aceitar -->
  <div class="ifood-lane">
    <button class="ifood-lane-header">
      <div class="ifood-lane-title"><h3>Aceitar</h3><span class="ifood-lane-count">2</span></div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <div class="ifood-lane-cards">
      <div class="ifood-card urgente">
        <div class="ifood-card-num">3598</div>
        <div class="ifood-card-nome">João da Silva</div>
        <button class="ifood-card-btn"><span class="ifood-card-btn-bar" style="animation-delay: -157s;"></span><span class="ifood-card-btn-label">Aceitar</span></button>
      </div>
      <div class="ifood-card urgente">
        <div class="ifood-card-num">3601</div>
        <div class="ifood-card-nome">Maria Souza</div>
        <button class="ifood-card-btn"><span class="ifood-card-btn-bar" style="animation-delay: -12s;"></span><span class="ifood-card-btn-label">Aceitar</span></button>
      </div>
    </div>
  </div>

  <!-- Em preparo -->
  <div class="ifood-lane">
    <button class="ifood-lane-header">
      <div class="ifood-lane-title"><h3>Em preparo</h3><span class="ifood-lane-count">2</span></div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <div class="ifood-lane-cards">
      <div class="ifood-card">
        <div class="ifood-card-num">3590</div>
        <div class="ifood-card-nome">Carlos Pereira</div>
        <button class="ifood-card-btn"><span class="ifood-card-btn-bar" style="animation-duration: 1200s; animation-delay: -540s;"></span><span class="ifood-card-btn-label">Pronto p/ entrega</span></button>
      </div>
      <div class="ifood-card">
        <div class="ifood-card-num">3595</div>
        <div class="ifood-card-nome">Ana Lima</div>
        <button class="ifood-card-btn"><span class="ifood-card-btn-bar" style="animation-duration: 1200s; animation-delay: -200s;"></span><span class="ifood-card-btn-label">Pronto p/ retirada</span></button>
      </div>
    </div>
  </div>

  <!-- Pronto -->
  <div class="ifood-lane">
    <button class="ifood-lane-header">
      <div class="ifood-lane-title"><h3>Pronto</h3><span class="ifood-lane-count">1</span></div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <div class="ifood-lane-cards">
      <div class="ifood-card">
        <div class="ifood-card-num">3585</div>
        <div class="ifood-card-nome">Pedro Santos</div>
        <div class="ifood-card-btn ifood-card-btn-muted">Aguardando entregador…</div>
      </div>
    </div>
  </div>

  <!-- Em rota -->
  <div class="ifood-lane">
    <button class="ifood-lane-header">
      <div class="ifood-lane-title"><h3>Em rota</h3><span class="ifood-lane-count">1</span></div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <div class="ifood-lane-cards">
      <div class="ifood-card">
        <div class="ifood-card-num">3578</div>
        <div class="ifood-card-nome">Lucas Ferreira</div>
        <div class="ifood-card-btn ifood-card-btn-muted">Em rota</div>
      </div>
    </div>
  </div>

  <!-- Finalizados -->
  <div class="ifood-lane">
    <button class="ifood-lane-header">
      <div class="ifood-lane-title"><h3>Finalizados</h3><span class="ifood-lane-count">3</span></div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <div class="ifood-lane-cards">
      <div class="ifood-card">
        <div class="ifood-card-num">6386</div>
        <div class="ifood-card-nome">Pedido S.</div>
        <div class="ifood-card-btn ifood-card-btn-muted">✓ Entregue</div>
      </div>
      <div class="ifood-card">
        <div class="ifood-card-num">6380</div>
        <div class="ifood-card-nome">Cliente A.</div>
        <div class="ifood-card-btn ifood-card-btn-muted">✓ Finalizado</div>
      </div>
      <div class="ifood-card">
        <div class="ifood-card-num">6375</div>
        <div class="ifood-card-nome">Cliente B.</div>
        <div class="ifood-card-btn ifood-card-btn-muted">✓ Entregue</div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
