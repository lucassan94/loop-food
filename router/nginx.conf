worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ─── API PROXY ──────────────────────────────────────
        location /api/ {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─── WEBSOCKET PROXY ────────────────────────────────
        location /socket.io/ {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # ─── UPLOADS PROXY ──────────────────────────────────
        location /uploads/ {
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
        }

        # ─── RESTAURANTE SPA (admin) ────────────────────────
        # Servido em /admin/ — tenta arquivo real, senão fallback pro index.html
        # do admin para o Vue Router lidar com a rota
        location /admin {
            try_files $uri $uri/ /admin/index.html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ─── ENTREGADOR SPA ─────────────────────────────────
        location /entregador {
            try_files $uri $uri/ /entregador/index.html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ─── CLIENTE SPA (root) ─────────────────────────────
        # Catch-all: serve o index.html do cliente (SPA mode)
        location / {
            try_files $uri $uri/ /index.html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
