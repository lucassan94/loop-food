worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Security Headers ────────────────────────────────────────
    # CSP rigorosa (CWE-79): protege os 3 SPAs contra XSS.
    # O router atende cliente (/), admin (/admin) e entregador (/entregador)
    # sob o mesmo dominio, portanto a CSP usa o superconjunto de fontes
    # necessarias para todos os SPAs.
    # Single-line para compatibilidade com proxies reversos (RFC 7230).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://viacep.com.br https://brasilapi.com.br; connect-src 'self' https://viacep.com.br https://brasilapi.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Rate Limiting ─────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ─── API PROXY ──────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─── WEBSOCKET PROXY ────────────────────────────────
        location /socket.io/ {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # ─── UPLOADS PROXY ──────────────────────────────────
        location /uploads/ {
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
        }

        # ─── RESTAURANTE SPA (admin) ────────────────────────
        # Servido em /admin/ — tenta arquivo real, senão fallback pro index.html
        # do admin para o Vue Router lidar com a rota
        location /admin {
            try_files $uri $uri/ /admin/index.html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ─── ENTREGADOR SPA ─────────────────────────────────
        location /entregador {
            try_files $uri $uri/ /entregador/index.html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ─── CLIENTE SPA (root) ─────────────────────────────
        # Catch-all: serve o index.html do cliente (SPA mode)
        location / {
            try_files $uri $uri/ /index.html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
