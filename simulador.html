<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaborExpress — Simulador Multi-Módulo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface-2: #22222e;
      --border: #2a2a3a;
      --text: #e8e8f0;
      --text-muted: #8888a0;
      --primary: #e63946;
      --primary-glow: rgba(230, 57, 70, 0.15);
      --radius: 12px;
      --shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 0 1rem;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(230, 57, 70, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(230, 57, 70, 0.03) 0%, transparent 50%);
    }

    /* ─── Header ─── */
    .header {
      text-align: center;
      margin-bottom: 1.5rem;
      width: 100%;
      max-width: 100%;
      padding: 0 1rem;
    }

    .header h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #e63946 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 0.3rem;
    }

    .header .urls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.6rem;
      font-size: 0.7rem;
      flex-wrap: wrap;
    }

    .header .urls a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .header .urls a:hover {
      color: var(--primary);
      border-color: var(--primary-glow);
      background: var(--primary-glow);
    }

    .header .urls .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-right: 3px;
    }
    .dot.cliente { background: #22c55e; }
    .dot.entregador { background: #f59e0b; }
    .dot.admin { background: #3b82f6; }

    /* ─── Scrollable Container ─── */
    .scroll-wrap {
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      padding: 0.5rem 1rem 1.5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .scroll-wrap::-webkit-scrollbar {
      height: 8px;
    }
    .scroll-wrap::-webkit-scrollbar-track {
      background: transparent;
    }
    .scroll-wrap::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .scroll-wrap::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* ─── Devices Row ─── */
    .devices-row {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
      flex-wrap: nowrap;
      width: max-content;
      min-width: 100%;
      padding: 0 0.5rem;
    }

    .device-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      flex: 0 0 auto;
    }

    .device-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .device-label .label-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .label-dot.cliente { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.4); }
    .label-dot.admin   { background: #3b82f6; box-shadow: 0 0 6px rgba(59,130,246,0.4); }
    .label-dot.entregador { background: #f59e0b; box-shadow: 0 0 6px rgba(245,158,11,0.4); }

    .device-label small {
      font-weight: 400;
      font-size: 0.6rem;
      color: var(--text-muted);
      opacity: 0.6;
    }

    /* ─── Phone Frame (portrait, ~19:9) ─── */
    .phone-frame {
      position: relative;
      width: 280px;
      height: 560px;
      background: #0a0a0a;
      border-radius: 38px;
      padding: 10px;
      box-shadow:
        0 0 0 3px #2a2a2a,
        0 0 0 6px #1a1a1a,
        0 25px 60px -12px rgba(0,0,0,0.9),
        inset 0 0 0 1px rgba(255,255,255,0.04);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .phone-frame:hover {
      box-shadow:
        0 0 0 3px #3a3a3a,
        0 0 0 6px #1a1a1a,
        0 30px 70px -12px rgba(0,0,0,0.95),
        inset 0 0 0 1px rgba(255,255,255,0.06);
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 28px;
      overflow: hidden;
      background: #fff;
      position: relative;
    }

    .phone-screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Phone notch */
    .phone-notch {
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 22px;
      background: #0a0a0a;
      border-radius: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .phone-notch .camera {
      width: 8px; height: 8px;
      background: radial-gradient(circle at 40% 35%, #1a1a2e, #0a0a0a);
      border-radius: 50%;
      border: 1px solid #222;
    }

    .phone-notch .sensor {
      width: 22px; height: 3px;
      background: #14141e;
      border-radius: 2px;
    }

    /* Side buttons */
    .phone-frame::before {
      content: '';
      position: absolute;
      left: -3px;
      top: calc(100% * 130 / 560);
      width: 3px;
      height: calc(100% * 40 / 560);
      background: #2a2a2a;
      border-radius: 2px 0 0 2px;
    }

    .phone-frame::after {
      content: '';
      position: absolute;
      right: -3px;
      top: calc(100% * 100 / 560);
      width: 3px;
      height: calc(100% * 50 / 560);
      background: #2a2a2a;
      border-radius: 0 2px 2px 0;
    }

    /* Home indicator */
    .phone-home-indicator {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
      z-index: 10;
    }

    /* ─── Landscape Frame (16:9) ─── */
    .landscape-frame {
      position: relative;
      width: 640px;
      background: #0a0a0a;
      border-radius: 16px;
      padding: 10px;
      box-shadow:
        0 0 0 3px #2a2a2a,
        0 0 0 6px #1a1a1a,
        0 25px 60px -12px rgba(0,0,0,0.9),
        inset 0 0 0 1px rgba(255,255,255,0.04);
      flex-shrink: 0;
      transition: all 0.2s;
      aspect-ratio: 16 / 9;
    }

    .landscape-frame:hover {
      box-shadow:
        0 0 0 3px #3a3a3a,
        0 0 0 6px #1a1a1a,
        0 30px 70px -12px rgba(0,0,0,0.95),
        inset 0 0 0 1px rgba(255,255,255,0.06);
    }

    .landscape-screen {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      position: relative;
    }

    .landscape-screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Admin camera dot (top center) */
    .landscape-camera {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: radial-gradient(circle at 40% 35%, #1a1a2e, #0a0a0a);
      border-radius: 50%;
      border: 1px solid #222;
      z-index: 10;
    }

    /* ─── Footer ─── */
    .footer {
      text-align: center;
      padding: 1.2rem;
      color: var(--text-muted);
      font-size: 0.7rem;
      opacity: 0.5;
    }

    /* ─── Responsive ─── */
    @media (max-width: 1300px) {
      .phone-frame { width: 260px; height: 520px; }
      .phone-frame::before { top: calc(100% * 120 / 520); }
      .phone-frame::after { top: calc(100% * 90 / 520); }
      .landscape-frame { width: 600px; }
    }

    @media (max-width: 1160px) {
      .phone-frame { width: 240px; height: 480px; border-radius: 34px; padding: 9px; }
      .phone-screen { border-radius: 26px; }
      .phone-notch { width: 80px; height: 20px; }
      .phone-frame::before { top: calc(100% * 110 / 480); }
      .phone-frame::after { top: calc(100% * 80 / 480); }
      .landscape-frame { width: 560px; }
      .devices-row { gap: 1.2rem; }
    }

    @media (max-width: 1060px) {
      .phone-frame { width: 220px; height: 440px; border-radius: 30px; padding: 8px; }
      .phone-screen { border-radius: 22px; }
      .phone-notch { width: 70px; height: 18px; top: 5px; }
      .phone-notch .camera { width: 6px; height: 6px; }
      .phone-notch .sensor { width: 18px; height: 2px; }
      .phone-home-indicator { width: 90px; }
      .phone-frame::before { height: calc(100% * 35 / 440); top: calc(100% * 100 / 440); }
      .phone-frame::after { height: calc(100% * 40 / 440); top: calc(100% * 70 / 440); }
      .landscape-frame { width: 520px; border-radius: 14px; }
      .devices-row { gap: 1rem; }
      .device-label { font-size: 0.7rem; }
    }

    @media (max-width: 960px) {
      .phone-frame { width: 200px; height: 400px; border-radius: 28px; padding: 7px; }
      .phone-screen { border-radius: 20px; }
      .phone-notch { width: 60px; height: 16px; top: 4px; gap: 4px; }
      .phone-notch .camera { width: 5px; height: 5px; }
      .phone-notch .sensor { width: 14px; height: 2px; }
      .phone-home-indicator { width: 80px; height: 3px; bottom: 4px; }
      .phone-frame::before { top: calc(100% * 90 / 400); }
      .phone-frame::after { top: calc(100% * 60 / 400); }
      .landscape-frame { width: 480px; border-radius: 12px; padding: 8px; }
      .landscape-screen { border-radius: 6px; }
      .devices-row { gap: 0.8rem; }
    }

    @media (max-width: 860px) {
      .phone-frame { width: 180px; height: 360px; border-radius: 24px; padding: 6px; }
      .phone-screen { border-radius: 18px; }
      .phone-notch { width: 50px; height: 14px; top: 3px; }
      .phone-notch .camera { width: 4px; height: 4px; }
      .phone-notch .sensor { width: 12px; height: 2px; }
      .phone-home-indicator { width: 70px; bottom: 3px; }
      .landscape-frame { width: 440px; }
      .device-label { font-size: 0.6rem; }
    }

    @media (max-width: 480px) {
      body { padding: 1rem 0; }
      .header h1 { font-size: 1rem; }
      .devices-row { gap: 0.6rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1>SaborExpress — Simulador Multi-Módulo</h1>
    <p>Visualize os três módulos da plataforma lado a lado</p>
    <div class="urls">
      <a href="http://86.48.18.22:8091/" target="_blank">
        <span class="dot cliente"></span>Cliente <code>:8091</code>
      </a>
      <a href="http://86.48.18.22:8092/" target="_blank">
        <span class="dot admin"></span>Admin <code>:8092</code>
      </a>
      <a href="http://86.48.18.22:8093/" target="_blank">
        <span class="dot entregador"></span>Entregador <code>:8093</code>
      </a>
    </div>
  </header>

  <!-- Scrollable wrapper for horizontal scroll -->
  <div class="scroll-wrap">

    <div class="devices-row">

      <!-- ─── Cliente (Phone) ─── -->
      <div class="device-wrapper">
        <div class="device-label">
          <span class="label-dot cliente"></span>
          Cliente <small>· App do Consumidor</small>
        </div>
        <div class="phone-frame">
          <div class="phone-screen">
            <div class="phone-notch">
              <span class="sensor"></span>
              <span class="camera"></span>
            </div>
            <iframe
              src="http://86.48.18.22:8091/"
              title="App Cliente"
              loading="lazy"
              sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
              scrolling="no"
            ></iframe>
            <div class="phone-home-indicator"></div>
          </div>
        </div>
      </div>

      <!-- ─── Admin (16:9 Landscape) ─── -->
      <div class="device-wrapper">
        <div class="device-label">
          <span class="label-dot admin"></span>
          Admin <small>· Painel de Gestão</small>
        </div>
        <div class="landscape-frame">
          <div class="landscape-screen">
            <div class="landscape-camera"></div>
            <iframe
              src="http://86.48.18.22:8092/"
              title="Painel Admin"
              loading="lazy"
              sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
              scrolling="no"
            ></iframe>
          </div>
        </div>
      </div>

      <!-- ─── Entregador (Phone) ─── -->
      <div class="device-wrapper">
        <div class="device-label">
          <span class="label-dot entregador"></span>
          Entregador <small>· App do Driver</small>
        </div>
        <div class="phone-frame">
          <div class="phone-screen">
            <div class="phone-notch">
              <span class="sensor"></span>
              <span class="camera"></span>
            </div>
            <iframe
              src="http://86.48.18.22:8093/"
              title="App Entregador"
              loading="lazy"
              sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
              scrolling="no"
            ></iframe>
            <div class="phone-home-indicator"></div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    SaborExpress © 2026 — Simulador de módulos
  </div>

</body>
</html>
